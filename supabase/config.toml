# Supabase Configuration

[project]
# This is your Supabase project ID - update if needed
# project_id = "hduqkztwwvbgmttlmsle"

[api]
# Port to use for Supabase local development
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
# Port to use for database
port = 54322
# Shadow database port (for migrations)
shadow_port = 54323
major_version = 15

[realtime]
# Realtime engine
enabled = true
max_bytes_per_second = 1000000
max_concurrent_users = 200
max_events_per_second = 10000

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry_seconds = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval_seconds = 10
enable_signup = true
email_provider_enabled = true
phone_provider_enabled = false

[storage]
file_size_limit = 52428800

[functions."auth/register"]
verify_jwt = false

[functions."receipts/create"]
verify_jwt = true

[functions."payments/create"]
verify_jwt = true

[functions."payments/process"]
verify_jwt = true

[functions."dispersions/create"]
verify_jwt = true

[functions."dispersions/process"]
verify_jwt = true

[functions."dashboard/metrics"]
verify_jwt = true
