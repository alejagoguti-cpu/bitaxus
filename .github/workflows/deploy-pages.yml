name: Deploy Bitaxus Dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm run build:client && pnpm run postbuild:client
        env:
          GITHUB_ACTIONS: true
          # Estas dos variables son públicas por diseño y están protegidas por RLS.
          # La service role key nunca se incluye en este workflow ni en el bundle.
          VITE_SUPABASE_URL: https://hduqkztwwvbgmttlmsle.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_V5PJfk7ZDr2frE8o-Ry8yQ_qSbFnjYR
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
